name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-features
        env:
          RUSTFLAGS: -D warnings
      - name: Check every target
        run: cargo check --all-targets --all-features
      - name: Run examples
        run: |
          cargo run --example basic
          cargo run --example slots
          cargo run --example search

  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all, pedantic, nursery, cargo)
        run: cargo clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -D warnings

  msrv:
    name: Minimum Rust version (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - run: cargo check --lib --all-features

  no-std:
    name: no_std target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - run: cargo check --lib --target x86_64-unknown-none

  docs-and-package:
    name: Documentation and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build API documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify crates.io package
        run: cargo package

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.49.1 --config .github/linters/.markdown-lint.yml README.md '.github/ISSUE_TEMPLATE/*.md' .github/pull_request_template.md
